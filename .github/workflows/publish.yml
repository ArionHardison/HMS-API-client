name: publish
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for ad-hoc run'
        required: false
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # `src/generated/api-types.ts` is gitignored (regenerated from
      # spec/openapi.json); build:lib (tsc) and the coverage contract both read
      # it, so a clean runner must generate it first — the same order
      # sre-contract.yml's types:check uses. Without this step the tag path
      # failed with TS2307 in src/typed-contract.ts and ENOENT in
      # spec-coverage.contract.test.ts.
      - run: npm run generate:types
      - run: npm run build:lib
      - run: npm run test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arionhardison'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm ci --ignore-scripts
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
