# SRE contract lock — makes the SDK's spec/type/coverage contracts RUN in CI.
#
# The "cannot be broken" requirement: contract enforcement is worthless if it
# only lives in package.json scripts a developer may or may not run. This
# workflow runs the gate on every push to main and every pull request, so a
# drifted client (generated types out of sync with spec/openapi.json), a type
# regression, or a coverage-contract failure blocks the merge — mechanically,
# not by convention.
#
# It is intentionally SEPARATE from publish.yml: publish.yml is tag-gated
# (release build + npm publish) and must not fire on ordinary PRs. This job is
# PR/push-gated. Splitting them keeps the release path and the contract gate
# from entangling triggers.
#
# ACTIVATION: `npm run types:check` (regenerate generated client/types +
# operation-index from spec/openapi.json, `git diff --exit-code src/generated`,
# then `tsc -p tsconfig.typecheck.json` via types:test-d) lands with
# PR #11 (feat/typed-contract-operationid-client). Until #11 merges, `main`
# has no types:check script, so that step is guarded and no-ops with a clear
# message; the moment #11 merges to main it RUNS and GATES (RED->GREEN). The
# `vitest run` step already enforces the real coverage contract today
# (src/__tests__/contract/spec-coverage.contract.test.ts is on main).
name: sre-contract

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sre-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Drift gate (PR #11). Guarded so `main` stays green until #11 lands the
      # script; enforces for real thereafter. Do not remove the guard when #11
      # merges — it simply becomes a no-op branch that never executes.
      - name: Typed-contract drift check (types:check — activates with PR #11)
        run: |
          if npm run 2>/dev/null | grep -qE '^\s+types:check'; then
            echo "types:check present — enforcing spec/type drift contract."
            npm run types:check
          else
            echo "::notice::types:check script absent on this ref — skipping."
            echo "It lands with PR #11 (feat/typed-contract-operationid-client);"
            echo "this step RUNS and GATES automatically once #11 merges to main."
          fi

      # Coverage contract + full unit/contract suite. `vitest run` (not watch)
      # picks up src/__tests__/contract/spec-coverage.contract.test.ts, the
      # real coverage contract, which is already on main.
      - name: Contract + coverage suite (vitest run)
        run: npx vitest run
